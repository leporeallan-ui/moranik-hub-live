<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moranik Hub - Database Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f0f0f 0%, #1a1a1a 100%);
            color: #ffffff;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 30px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        h1 {
            text-align: center;
            color: #ff4444;
            margin-bottom: 30px;
            font-size: 2.5em;
            text-shadow: 0 0 20px rgba(255, 68, 68, 0.3);
        }
        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #ff4444;
        }
        .stat-label {
            color: #cccccc;
            margin-top: 5px;
        }
        .section {
            margin-bottom: 30px;
        }
        .section h2 {
            color: #ff4444;
            margin-bottom: 15px;
            border-bottom: 2px solid #ff4444;
            padding-bottom: 10px;
        }
        .user-table, .token-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .user-table th, .token-table th {
            background: rgba(255, 68, 68, 0.2);
            color: #ffffff;
            padding: 12px;
            text-align: left;
            font-weight: bold;
        }
        .user-table td, .token-table td {
            padding: 10px 12px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        .user-table tr:hover, .token-table tr:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        .btn {
            background: #ff4444;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #ff6666;
        }
        .btn-danger {
            background: #ff6666;
        }
        .btn-danger:hover {
            background: #ff8888;
        }
        .loading {
            text-align: center;
            padding: 50px;
            color: #ff4444;
        }
        .timestamp {
            color: #888888;
            font-size: 0.9em;
            text-align: center;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🗄️ Database Manager</h1>
        
        <div class="timestamp" id="timestamp"></div>
        
        <div class="stats" id="stats"></div>
        
        <div class="section">
            <h2>👥 Users</h2>
            <div id="users-section"></div>
        </div>
        
        <div class="section">
            <h2>🔑 Admin</h2>
            <div id="admin-section"></div>
        </div>
        
        <div class="section">
            <h2>🎫 Active Tokens</h2>
            <div id="tokens-section"></div>
        </div>
        
        <div class="section">
            <h2>⚙️ Database Operations</h2>
            <button class="btn" onclick="refreshData()">🔄 Refresh Data</button>
            <button class="btn btn-danger" onclick="clearTokens()">🗑️ Clear All Tokens</button>
            <button class="btn btn-danger" onclick="resetDatabase()">⚠️ Reset Database (DANGER!)</button>
        </div>
    </div>

    <script>
        let databaseData = null;
        let isAuthenticated = true; // Always authenticated - password disabled

        // Check authentication first
        function checkAuthentication() {
            return isAuthenticated; // Always return true
        }

        function showLoginForm() {
            // No login form needed - password disabled
            loadMainInterface();
        }

        function loadMainInterface() {
            // Load the original interface
            document.getElementById('app-container').innerHTML = `
                <h1>🗄️ Database Manager</h1>
                
                <div class="timestamp" id="timestamp"></div>
                
                <div class="stats" id="stats"></div>
                
                <div class="section">
                    <h2>👥 Users</h2>
                    <div id="users-section"></div>
                </div>
                
                <div class="section">
                    <h2>🔑 Admin</h2>
                    <div id="admin-section"></div>
                </div>
                
                <div class="section">
                    <h2>🎫 Active Tokens</h2>
                    <div id="tokens-section"></div>
                </div>
                
                <div class="section">
                    <h2>⚙️ Database Operations</h2>
                    <button class="btn" onclick="refreshData()">🔄 Refresh Data</button>
                    <button class="btn btn-danger" onclick="clearTokens()">🗑️ Clear All Tokens</button>
                    <button class="btn btn-danger" onclick="resetDatabase()">⚠️ Reset Database (DANGER!)</button>
                    <button class="btn" onclick="logout()" style="background: #666;">🔒 Logout</button>
                </div>
            `;
            
            // Load data after showing main interface
            loadData();
        }

        function logout() {
            sessionStorage.removeItem('dbAuth');
            isAuthenticated = false;
            showLoginForm();
        }

        async function loadData() {
            if (!isAuthenticated) return;
            
            try {
                const response = await fetch('/api/database/manager');
                const result = await response.json();
                
                if (result.success) {
                    databaseData = result.data;
                    displayData();
                } else {
                    document.getElementById('users-section').innerHTML = 
                        '<p style="color: #ff6666;">Error loading database: ' + result.error + '</p>';
                }
            } catch (error) {
                document.getElementById('users-section').innerHTML = 
                    '<p style="color: #ff6666;">Network error: ' + error.message + '</p>';
            }
        }

        function displayData() {
            if (!databaseData) return;

            // Update timestamp
            document.getElementById('timestamp').textContent = 
                'Last updated: ' + new Date(databaseData.timestamp).toLocaleString();

            // Display statistics
            const statsHtml = `
                <div class="stat-card">
                    <div class="stat-number">${databaseData.statistics.totalUsers}</div>
                    <div class="stat-label">Total Users</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${databaseData.statistics.totalTokens}</div>
                    <div class="stat-label">Active Tokens</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${databaseData.statistics.adminExists ? 'Yes' : 'No'}</div>
                    <div class="stat-label">Admin Setup</div>
                </div>
            `;
            document.getElementById('stats').innerHTML = statsHtml;

            // Display users
            if (databaseData.users.length > 0) {
                const usersHtml = `
                    <table class="user-table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Username</th>
                                <th>Email</th>
                                <th>Full Name</th>
                                <th>Email Verified</th>
                                <th>Created</th>
                                <th>Last Login</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${databaseData.users.map(user => `
                                <tr>
                                    <td>${user.id}</td>
                                    <td>${user.username}</td>
                                    <td>${user.email}</td>
                                    <td>${user.fullName}</td>
                                    <td>${user.isEmailVerified ? '✅ Yes' : '❌ No'}</td>
                                    <td>${new Date(user.createdAt).toLocaleString()}</td>
                                    <td>${user.lastLogin ? new Date(user.lastLogin).toLocaleString() : 'Never'}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
                document.getElementById('users-section').innerHTML = usersHtml;
            } else {
                document.getElementById('users-section').innerHTML = '<p>No users found in database.</p>';
            }

            // Display admin
            if (databaseData.admin) {
                const adminHtml = `
                    <table class="user-table">
                        <thead>
                            <tr>
                                <th>Username</th>
                                <th>Created</th>
                                <th>Password Status</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr>
                                <td>${databaseData.admin.username}</td>
                                <td>${new Date(databaseData.admin.createdAt).toLocaleString()}</td>
                                <td>🔒 Hashed</td>
                            </tr>
                        </tbody>
                    </table>
                `;
                document.getElementById('admin-section').innerHTML = adminHtml;
            } else {
                document.getElementById('admin-section').innerHTML = '<p>No admin account found.</p>';
            }

            // Display tokens
            if (databaseData.activeTokens.length > 0) {
                const tokensHtml = `
                    <table class="token-table">
                        <thead>
                            <tr>
                                <th>Token (Partial)</th>
                                <th>Username</th>
                                <th>Created</th>
                                <th>Expires</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${databaseData.activeTokens.map(token => `
                                <tr>
                                    <td>${token.token}</td>
                                    <td>${token.username}</td>
                                    <td>${new Date(token.createdAt).toLocaleString()}</td>
                                    <td>${new Date(token.expiresAt).toLocaleString()}</td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
                document.getElementById('tokens-section').innerHTML = tokensHtml;
            } else {
                document.getElementById('tokens-section').innerHTML = '<p>No active tokens found.</p>';
            }
        }

        async function refreshData() {
            document.getElementById('users-section').innerHTML = '<div class="loading">🔄 Refreshing data...</div>';
            await loadData();
        }

        async function clearTokens() {
            if (!isAuthenticated) return;
            
            if (confirm('⚠️ Are you sure you want to clear all tokens? This will log out all users.')) {
                try {
                    const response = await fetch('/api/database/tokens/clear', { 
                        method: 'DELETE',
                        headers: {
                            'Authorization': 'Basic ' + btoa('admin:' + DATABASE_PASSWORD)
                        }
                    });
                    const result = await response.json();
                    
                    if (result.success) {
                        alert('✅ All tokens cleared successfully!');
                        await loadData();
                    } else {
                        alert('❌ Error clearing tokens: ' + result.error);
                    }
                } catch (error) {
                    alert('❌ Network error: ' + error.message);
                }
            }
        }

        async function resetDatabase() {
            if (!isAuthenticated) return;
            
            if (confirm('⚠️ DANGER! This will reset the entire database and create a backup. Are you absolutely sure?')) {
                try {
                    const response = await fetch('/api/database/reset', { 
                        method: 'DELETE',
                        headers: {
                            'Authorization': 'Basic ' + btoa('admin:' + DATABASE_PASSWORD)
                        }
                    });
                    const result = await response.json();
                    
                    if (result.success) {
                        alert('✅ Database reset successfully! Backup created: ' + result.backupFile);
                        await loadData();
                    } else {
                        alert('❌ Error resetting database: ' + result.error);
                    }
                } catch (error) {
                    alert('❌ Network error: ' + error.message);
                }
            }
        }

        // Initialize page - direct access, no login required
        loadMainInterface();
    </script>
</body>
</html>
